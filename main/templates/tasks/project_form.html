{% extends "base.html" %}

{% block content %}
    <h2 class="mb-4">Formularz projektu</h2>
    <form method="post" class="needs-validation">
        {% csrf_token %}

        <div class="mb-3">
            {{ form.as_p }}
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary px-4">Zapisz</button>
            <a href="{% url 'project_list' %}" class="btn btn-secondary px-4">Powrót do listy projektów</a>
        </div>
    </form>
{% endblock %}
