{% extends "base.html" %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Lista zadań</h2>
        <a href="{% url 'task_add' %}" class="btn btn-success">+ Dodaj zadanie</a>
    </div>

    {% if tasks %}
        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>Tytuł</th>
                    <th>Status</th>
                    <th class="text-end">Opcje</th>
                </tr>
            </thead>
            <tbody>
            {% for task in tasks %}
                <tr>
                    <td>
                        <a href="{% url 'task_detail' task.pk %}" class="text-decoration-none fw-bold">
                            {{ task.title }}
                        </a>
                    </td>
                    <td>
                        <span class="badge {% if task.status == 'done' %}bg-success{% elif task.status == 'doing' %}bg-primary{% else %}bg-secondary{% endif %}">
                            {{ task.get_status_display }}
                        </span>
                    </td>
                    <td class="text-end">
                        <a href="{% url 'task_edit' task.pk %}" class="btn btn-primary">Edytuj</a>
                        <a href="{% url 'task_delete' task.pk %}" class="btn btn-danger">Usuń</a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="alert alert-info">Brak zadań na liście.</div>
    {% endif %}
{% endblock %}
