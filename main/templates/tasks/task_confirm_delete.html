{% extends "base.html" %}

{% block content %}
    <div class="alert alert-danger shadow-sm">
        <h2 class="alert-heading mb-3">Usuwanie zadania</h2>
        <p>Czy na pewno chcesz bezpowrotnie usunąć zadanie: <strong>{{ task.title }}</strong>?</p>
        <hr>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">Tak, usuń</button>
            <a href="{% url 'task_list' %}" class="btn btn-secondary px-4 ms-2">Anuluj</a>
        </form>
    </div>
{% endblock %}
